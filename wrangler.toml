name = "journal-worker"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

# Completely separate from addition-publishing worker
# Same Cloudflare account — separate resource names

[[d1_databases]]
binding = "DB"
database_name = "journal-db"
database_id = "YOUR_JOURNAL_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "journal-r2"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_JOURNAL_KV_NAMESPACE_ID"

[[queues.producers]]
binding = "QUEUE"
queue = "journal-queue"

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_URL = "https://Elsevierresearchjournal.com"
RESEND_FROM_EMAIL = "noreply@elsevierimj.com"


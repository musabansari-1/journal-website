# This file is for deploying the Worker separately
# Run: wrangler deploy --config wrangler.worker.toml

name = "journal-worker"
main = "workers/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "journal-db"
database_id = "YOUR_JOURNAL_D1_DATABASE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "journal-r2"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_JOURNAL_KV_NAMESPACE_ID"

[[queues.producers]]
binding = "QUEUE"
queue = "journal-queue"

[[queues.consumers]]
queue = "journal-queue"
max_batch_size = 10
max_batch_timeout = 30

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_URL = "https://nrityanjaliresearchjournal.com"
